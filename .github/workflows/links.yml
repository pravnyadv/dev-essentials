name: Link check

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:

jobs:
  links:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - run: npm run content
      - run: npm run links
